<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roky's Market | Embed Studio</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#eef1fa;background:#11131b;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}a{color:#a9baff}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#171925;border-right:1px solid #303347;padding:24px;display:flex;flex-direction:column;gap:20px}.logo{font-size:20px;font-weight:800}.logo span{color:#899bff}.nav{background:#29304f;padding:13px;border-radius:12px;color:#cdd7ff}.user{margin-top:auto;background:#242737;border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px}.user img{height:39px;width:39px;border-radius:50%}.user strong{display:block;max-width:136px;overflow:hidden;text-overflow:ellipsis}.user small{color:#a9b1c7}.main{max-width:1450px;padding:34px;margin:auto;width:100%}h1{font-size:30px;margin:0}h2{font-size:17px;margin:0 0 20px}.muted{color:#9fa8bc}.top{margin-bottom:28px}.columns{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1.12fr);gap:20px}.panel{background:#1b1e2b;border:1px solid #303548;border-radius:18px;padding:23px;margin-bottom:20px}.field{display:block;margin:14px 0;color:#b9c1d6;font-size:13px}.field>span{display:block;margin-bottom:8px}input,textarea,select{background:#10131e;border:1px solid #3b4259;color:#f1f3fd;border-radius:9px;padding:12px;width:100%;outline:0}textarea{resize:vertical;min-height:100px}input:focus,textarea:focus,select:focus{border-color:#899bff}.tabs{display:flex;gap:10px}.tabs button,.secondary{background:#2c3146;color:white;padding:11px 15px;border-radius:10px}.tabs .active{background:#6578ed}.primary{background:#697ef4;color:white;border-radius:10px;padding:13px 18px;font-weight:700}.primary:disabled{opacity:.45}.discord{background:#2b2d31;color:#dbdee1;padding:22px;border-radius:12px;min-height:220px}.msg-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px}.botpic{background:#5865f2;border-radius:50%;height:38px;width:38px;display:grid;place-items:center;color:white;font-weight:800}.embed{background:#232428;border-left:4px solid #697ef4;border-radius:4px;padding:14px;max-width:490px;overflow-wrap:anywhere}.embed strong{color:white}.embed p{white-space:pre-wrap;line-height:1.45}.embed img{max-width:100%;border-radius:6px}.footer{font-size:11px;opacity:.75}.status{margin-top:12px;min-height:22px;color:#aab8ff;overflow-wrap:anywhere}.records{display:flex;flex-direction:column;gap:10px}.record{padding:14px;background:#232638;border-radius:10px;display:flex;justify-content:space-between;gap:12px;align-items:center}.record div{display:flex;gap:8px}.record button{background:#343e64;color:white;padding:8px;border-radius:7px}.record .danger{background:#723542}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{max-width:420px;width:100%;padding:36px;text-align:center;background:#1b1e2b;border:1px solid #35394e;border-radius:20px}.loginbox h1{margin-bottom:12px}.loginbox p{color:#aab1c4;line-height:1.6}.loginbox .primary{display:inline-block;text-decoration:none;margin:18px 0}.err{color:#ff9d9d}@media(max-width:900px){.layout{display:block}.side{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px}.user{margin:0 0 0 auto}.main{padding:16px}.columns{grid-template-columns:1fr}}@media(max-width:550px){.record{align-items:flex-start;flex-direction:column}.user strong{max-width:110px}}
</style></head><body><div id="root"></div><script>const API=__API_URL__;</script>
<script>
const $=s=>document.querySelector(s);let user=null,guilds=[],channels=[],records=[],selected=null;
let doc={mode:'embed',title:'Welcome to Roky\'s Market!',description:'We are happy to have you here.',color:'#5865F2',footer:'Roky\'s Market',image:'',thumbnail:''};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function req(path,opt={}){let r=await fetch(API+path,{credentials:'include',...opt,headers:{'Content-Type':'application/json',...(user?.csrf?{'X-CSRF-Token':user.csrf}:{}),...opt.headers}});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.detail||'Request failed: '+r.status);return data}
function notice(t){const el=$('#status');if(el)el.textContent=t}
function field(label,key,type='text'){return '<label class="field"><span>'+label+'</span>'+(type==='textarea'?'<textarea id="f_'+key+'">'+esc(doc[key])+'</textarea>':'<input id="f_'+key+'" type="'+type+'" value="'+esc(doc[key])+'">')+'</label>'}
function render(){if(!user){$('#root').innerHTML='<div class="login"><div class="loginbox"><h1>✦ Roky\'s Market</h1><h2>Embed Studio</h2><p>Sign in with Discord to design and publish bot messages.</p>'+(new URLSearchParams(location.search).get('access')==='denied'?'<p class="err">Access denied. Contact the dashboard owner.</p>':'')+'<a class="primary" href="'+API+'/api/auth/login">Authorize with Discord</a><p>Only approved Discord accounts can enter.</p></div></div>';return}
$('#root').innerHTML='<div class="layout"><aside class="side"><div class="logo">✦ Roky\'s <span>Market</span></div><div class="nav">▣ Embed Builder</div><div class="user"><img alt="Discord avatar" src="'+esc(user.avatar)+'"><section><strong>'+esc(user.username)+'</strong><small>Discord account</small></section></div><button id="logout" class="secondary">Log out</button></aside><main class="main"><div class="top"><p class="muted">DASHBOARD / EMBED STUDIO</p><h1>Message Builder</h1><p class="muted">Create beautiful Discord embeds and Components V2 messages.</p></div><div class="columns"><div><section class="panel"><h2>Customize your message</h2><div class="tabs"><button id="embed" class="'+(doc.mode==='embed'?'active':'')+'">Classic Embed</button><button id="components" class="'+(doc.mode==='components'?'active':'')+'">Components V2</button></div>'+field('Title','title')+field('Description','description','textarea')+field('Accent color','color','color')+(doc.mode==='embed'?field('Footer','footer'):'')+field('Image HTTPS URL','image')+(doc.mode==='embed'?field('Thumbnail HTTPS URL','thumbnail'):'')+'</section></div><div><section class="panel"><h2>Live Discord Preview</h2><div class="discord"><div class="msg-header"><div class="botpic">R</div><strong>Roky\'s Market <small style="color:#a4aafc">APP</small></strong></div><div id="preview"></div></div><p class="muted" style="font-size:12px">Approximate rendering; final appearance depends on Discord.</p></section><section class="panel"><h2>Publish</h2><label class="field"><span>Discord server</span><select id="guild"><option value="">Choose server</option></select></label><label class="field"><span>Text channel</span><select id="channel"><option value="">Choose channel</option></select></label><button class="primary" id="send">Send message via bot</button><p id="status" class="status"></p></section></div></div><section class="panel"><h2>Sent messages</h2><div id="history" class="records"></div></section></main></div>';
for(const key of ['title','description','color','footer','image','thumbnail']){const el=$('#f_'+key);if(el)el.oninput=e=>{doc[key]=e.target.value;preview()}}
$('#embed').onclick=()=>{doc.mode='embed';selected=null;render()};
$('#components').onclick=()=>{doc.mode='components';selected=null;render()};
$('#logout').onclick=async()=>{try{await req('/api/auth/logout',{method:'POST'});user=null;render()}catch(e){notice(e.message)}};
const g=$('#guild');for(const x of guilds)g.add(new Option(x.name,x.id));g.onchange=async()=>{const id=g.value;const c=$('#channel');c.innerHTML='<option value="">Choose channel</option>';if(!id)return;try{channels=await req('/api/guilds/'+id+'/channels');for(const x of channels)c.add(new Option('# '+x.name,x.id))}catch(e){notice(e.message)}};
$('#send').onclick=async()=>{const guild_id=$('#guild').value,channel_id=$('#channel').value;if(!guild_id||!channel_id)return notice('Select server and channel');const btn=$('#send');btn.disabled=true;try{const r=await req('/api/messages',{method:'POST',body:JSON.stringify({guild_id,channel_id,document:doc})});notice('Message sent! '+r.url);records=await req('/api/messages');showHistory()}catch(e){notice(e.message)}finally{btn.disabled=false}};
preview();showHistory()}
function preview(){const e=$('#preview');if(!e)return;e.innerHTML='<div class="embed" style="border-left-color:'+esc(doc.color)+'"><strong>'+(doc.mode==='components'?'# ':'')+esc(doc.title||'Untitled')+'</strong><p>'+esc(doc.description).replace(/\n/g,'<br>')+'</p>'+(doc.image?'<img alt="Attached image" src="'+esc(doc.image)+'">':'')+(doc.footer&&doc.mode==='embed'?'<p class="footer">'+esc(doc.footer)+'</p>':'')+'</div>'}
function showHistory(){const root=$('#history');if(!root)return;root.innerHTML=records.length?records.map(r=>'<div class="record"><span>'+esc(r.document.title||'Untitled')+' <small class="muted">('+esc(r.mode)+')</small></span><div><a href="https://discord.com/channels/'+esc(r.guild_id)+'/'+esc(r.channel_id)+'/'+esc(r.message_id)+'" target="_blank" rel="noopener">View</a><button data-edit="'+r.id+'">Edit</button><button class="danger" data-delete="'+r.id+'">Delete</button></div></div>').join(''):'<p class="muted">No messages published yet.</p>';root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete from Discord?'))return;try{await req('/api/messages/'+b.dataset.delete,{method:'DELETE'});records=await req('/api/messages');showHistory()}catch(e){alert(e.message)}});root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const r=records.find(x=>String(x.id)===b.dataset.edit);if(!r)return;const title=prompt('Update title',r.document.title);if(title===null)return;const description=prompt('Update description',r.document.description);if(description===null)return;try{await req('/api/messages/'+r.id,{method:'PATCH',body:JSON.stringify({...r.document,title,description})});records=await req('/api/messages');showHistory()}catch(e){alert(e.message)}})}
(async()=>{try{user=await req('/api/me');[guilds,records]=await Promise.all([req('/api/guilds'),req('/api/messages')]);render()}catch(e){user=null;render()}})();
</script></body></html>
